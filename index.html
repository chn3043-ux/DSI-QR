<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>식대 QR 스캐너 (사진 촬영 방식)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #f9fafb;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: #111827; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px;
    }
    .wrap { width: 100%; max-width: 420px; text-align: center; }
    h1 { font-size: 18px; margin: 0 0 20px; font-weight: 700; color: #111827; }
    
    /* 카메라 실행 버튼 스타일 */
    .scan-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 100%; padding: 16px 24px; background-color: #2563eb; color: white;
      border: none; border-radius: 12px; font-size: 16px; font-weight: 600;
      cursor: pointer; transition: background-color 0.2s; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .scan-btn:active { background-color: #1d4ed8; }
    .scan-btn-icon { margin-right: 8px; font-size: 20px; }

    /* 숨겨진 file input */
    #qr-input { display: none; }

    .hint { font-size: 14px; color: #6b7280; margin-top: 20px; min-height: 40px; line-height: 1.5; white-space: pre-line; }
    .ok { color: #16a34a; font-weight: 700; }
    .err { color: #dc2626; }
    
    .back-link { display: block; text-align: center; margin-top: 24px; font-size: 14px; color: #2563eb; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🍽 식당 QR 체크인</h1>
    
    <!-- 이 버튼을 누르면 아래 hidden input이 클릭되어 카메라가 실행됨 -->
    <button class="scan-btn" onclick="document.getElementById('qr-input').click();">
      <span class="scan-btn-icon">📷</span>
      QR 코드 촬영하여 스캔
    </button>
    
    <!-- 모바일에서 카메라 촬영을 유도하는 핵심 input 태그 -->
    <input type="file" accept="image/*" capture="environment" id="qr-input">

    <div class="hint" id="hint">아래 버튼을 눌러 식당 QR 코드를 촬영해 주세요.</div>
    <a href="#" id="backLink" class="back-link" style="display:none;">← 취소하고 돌아가기</a>
  </div>

  <!-- QR 인식 라이브러리 (html5-qrcode로 변경, 사진 분석에 더 강력함) -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script>
    var hintEl = document.getElementById('hint');
    var backLink = document.getElementById('backLink');
    var qrInput = document.getElementById('qr-input');
    
    // 허용된 호스트 설정 (이전과 동일)
    var ALLOWED_HOSTS = ['script.google.com', 'script.googleusercontent.com'];

    function setHint(text, cls) {
      hintEl.textContent = text;
      hintEl.className = 'hint' + (cls ? ' ' + cls : '');
    }

    // 뒤로가기 링크 설정 (이전과 동일)
    function setupBackLink() {
      var params = new URLSearchParams(location.search);
      var back = params.get('back');
      if (back) {
        try {
          var backUrl = new URL(back);
          backLink.href = backUrl.href;
          backLink.style.display = 'block';
        } catch (e) {}
      }
    }

    function isAllowedUrl(text) {
      try {
        var u = new URL(text);
        if (u.protocol !== 'https:' && u.protocol !== 'http:') return false;
        return ALLOWED_HOSTS.indexOf(u.hostname) !== -1;
      } catch (e) { return true; } // URL이 아니면 true (데이터로 처리)
    }

    // 파일 입력값 변경 시 (사진 촬영 완료 시) 실행되는 로직
    qrInput.addEventListener('change', function(e) {
      if (e.target.files.length === 0) {
        setHint('사진이 선택되지 않았습니다.', 'err');
        return;
      }
      
      var imageFile = e.target.files[0];
      setHint('사진 분석 중...', 'ok');

      // html5-qrcode 라이브러리를 사용하여 이미지 파일에서 QR 코드 스캔
      const html5QrCode = new Html5Qrcode("hint"); // dummy ID, 사용안함
      html5QrCode.scanFile(imageFile, true)
        .then(function(decodedText) {
          // QR 인식 성공
          onDecoded(decodedText);
        })
        .catch(function(err) {
          // QR 인식 실패
          console.error("QR 인식 실패:", err);
          setHint('QR 코드를 인식할 수 없습니다.\n사진을 다시 명확하게 촬영해 주세요.', 'err');
        });
    });

    function onDecoded(text) {
      if (!isAllowedUrl(text)) {
        setHint('알 수 없는 QR입니다. 식대 체크인용 QR을 스캔해주세요.', 'err');
        return;
      }
      
      setHint('인식 완료! (' + text + ')\n이동 중...', 'ok');
      
      setTimeout(function() {
        // URL이면 이동, 아니면 이전 페이지(back)로 데이터 전달
        if (text.startsWith('http://') || text.startsWith('https://')) {
          location.href = text;
        } else {
          var params = new URLSearchParams(location.search);
          var back = params.get('back');
          if (back) {
            var joinChar = back.indexOf('?') !== -1 ? '&' : '?';
            location.href = back + joinChar + 'qrData=' + encodeURIComponent(text);
          }
        }
      }, 400);
    }

    setupBackLink();
  </script>
</body>
</html>
