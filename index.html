<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>식대 QR 스캐너</title>
  <!-- jsQR을 받아올 CDN과, 스캔 성공 후 돌아갈 Apps Script 도메인에 미리 연결을 준비해둔다 -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px;
    }
    .wrap { width: 100%; max-width: 420px; }
    h1 { font-size: 16px; text-align: center; margin: 0 0 14px; font-weight: 700; }
    .viewport {
      position: relative; width: 100%; aspect-ratio: 1 / 1; background: #111; border-radius: 16px; overflow: hidden;
    }
    .viewport video { width: 100%; height: 100%; object-fit: cover; }
    .frame { position: absolute; inset: 14%; border: 3px solid #22c55e; border-radius: 16px; pointer-events: none; }
    .hint { font-size: 13px; text-align: center; color: #d1d5db; margin-top: 14px; min-height: 40px; line-height: 1.5; white-space: pre-line; }
    .ok { color: #4ade80; font-weight: 700; }
    .err { color: #f87171; }
    .back-link {
      display: block; text-align: center; margin-top: 18px; font-size: 13px; color: #93c5fd; text-decoration: underline;
    }
    canvas { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🍽 식당 QR 스캔</h1>
    <div class="viewport">
      <video id="video" playsinline autoplay muted></video>
      <div class="frame"></div>
    </div>
    <div class="hint" id="hint">카메라를 준비하는 중...</div>
    <a href="#" id="backLink" class="back-link" style="display:none;">← 취소하고 돌아가기</a>
  </div>
  <canvas id="canvas"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<script>
  // 1. 단순 텍스트, 숫자, 다른 URL도 모두 인식하도록 도메인 검증 완화/수정
  var ALLOWED_HOSTS = ['script.google.com', 'script.googleusercontent.com'];

  var hintEl = document.getElementById('hint');
  var backLink = document.getElementById('backLink');
  var video = document.getElementById('video');
  var canvas = document.getElementById('canvas');
  var stream = null;
  var rafId = null;
  var active = false;
  var decoded = false;

  function setHint(text, cls) {
    hintEl.textContent = text;
    hintEl.className = 'hint' + (cls ? ' ' + cls : '');
  }

  function setupBackLink() {
    var params = new URLSearchParams(location.search);
    var back = params.get('back');
    if (back) {
      try {
        var backUrl = new URL(back);
        backLink.href = backUrl.href;
        backLink.style.display = 'block';
      } catch (e) {}
    }
  }

  function isAllowedUrl(text) {
    // QR 데이터가 URL 형태가 아닌 단순 텍스트/코드인 경우에도 허용하려면 아래 if문을 주석 처리하거나 true 반환
    try {
      var u = new URL(text);
      if (u.protocol !== 'https:' && u.protocol !== 'http:') return false;
      return ALLOWED_HOSTS.indexOf(u.hostname) !== -1;
    } catch (e) {
      // URL 형태가 아닌 단순 데이터(문자, 숫자)인 경우 true 처리
      return true; 
    }
  }

  function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setHint('이 브라우저는 카메라 기능을 지원하지 않습니다.\nSafari 또는 Chrome으로 열어주세요.', 'err');
      return;
    }

    // 2. 고해상도(1080p 이상) 및 후면 카메라 접사 초점 옵션 추가
    var constraints = {
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    };

    navigator.mediaDevices.getUserMedia(constraints)
      .catch(function() { return navigator.mediaDevices.getUserMedia({ video: true }); })
      .then(function(s) {
        stream = s;
        video.srcObject = s;
        video.play();
        active = true;
        setHint('식당에 부착된 QR코드를 화면 중앙에 맞춰주세요');
        rafId = requestAnimationFrame(scanLoop);
      })
      .catch(function(err) {
        setHint('카메라를 사용할 수 없습니다.\n권한을 허용해 주세요.', 'err');
      });
  }

  function stopCamera() {
    active = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    if (stream) { stream.getTracks().forEach(function(t) { t.stop(); }); stream = null; }
  }

  function scanLoop() {
    if (!active) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      
      var code = null;
      try {
        // inversionAttempts 옵션을 'attemptBoth'로 변경하여 어두운 배경/반사 QR 인식률 대폭 향상
        code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'attemptBoth' }); 
      } catch (e) {}

      if (code && code.data) {
        onDecoded(code.data);
        return;
      }
    }
    rafId = requestAnimationFrame(scanLoop);
  }

  function onDecoded(text) {
    if (decoded) return;
    
    // 만약 QR 안에 URL이 들어가서 체크인 웹앱으로 이동시키는 형태가 아니라
    // 단순 값 전달이라면 아래 조건 판단 로직을 프로젝트 구조에 맞게 수정하세요.
    if (!isAllowedUrl(text)) {
      setHint('알 수 없는 QR입니다. 식대 체크인용 QR을 스캔해주세요.', 'err');
      rafId = requestAnimationFrame(scanLoop);
      return;
    }
    
    decoded = true;
    stopCamera();
    setHint('인식 완료! (' + text + ')\n이동 중...', 'ok');
    
    setTimeout(function() {
      // URL이면 해당 주소로 이동, URL이 아니면 이전 파라미터(back)에 데이터 얹어서 이동
      if (text.startsWith('http://') || text.startsWith('https://')) {
        location.href = text;
      } else {
        var params = new URLSearchParams(location.search);
        var back = params.get('back');
        if (back) {
          var joinChar = back.indexOf('?') !== -1 ? '&' : '?';
          location.href = back + joinChar + 'qrData=' + encodeURIComponent(text);
        }
      }
    }, 400);
  }

  setupBackLink();
  startCamera();
</script>
</body>
</html>
