<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>식대 QR 스캐너</title>
  <!-- jsQR을 받아올 CDN과, 스캔 성공 후 돌아갈 Apps Script 도메인에 미리 연결을 준비해둔다 -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px;
    }
    .wrap { width: 100%; max-width: 420px; }
    h1 { font-size: 16px; text-align: center; margin: 0 0 14px; font-weight: 700; }
    .viewport {
      position: relative; width: 100%; aspect-ratio: 1 / 1; background: #111; border-radius: 16px; overflow: hidden;
    }
    .viewport video { width: 100%; height: 100%; object-fit: cover; }
    .frame { position: absolute; inset: 14%; border: 3px solid #22c55e; border-radius: 16px; pointer-events: none; }
    .hint { font-size: 13px; text-align: center; color: #d1d5db; margin-top: 14px; min-height: 40px; line-height: 1.5; white-space: pre-line; }
    .ok { color: #4ade80; font-weight: 700; }
    .err { color: #f87171; }
    .back-link {
      display: block; text-align: center; margin-top: 18px; font-size: 13px; color: #93c5fd; text-decoration: underline;
    }
    canvas { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🍽 식당 QR 스캔</h1>
    <div class="viewport">
      <video id="video" playsinline autoplay muted></video>
      <div class="frame"></div>
    </div>
    <div class="hint" id="hint">카메라를 준비하는 중...</div>
    <a href="#" id="backLink" class="back-link" style="display:none;">← 취소하고 돌아가기</a>
  </div>
  <canvas id="canvas"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
  <script>
    // ------------------------------------------------------------------
    // 이 페이지는 Apps Script 웹앱과 별개로, GitHub Pages 같은 일반 도메인에
    // 올려두고 쓰는 "카메라 전용" 페이지입니다.
    // Google Apps Script(HtmlService) 웹앱은 자체 샌드박스 iframe 안에서
    // 렌더링되기 때문에, 그 안에서는 브라우저가 카메라 권한(getUserMedia)을
    // 아예 내려주지 않습니다(기기·브라우저와 무관하게 100% 차단). 이 페이지처럼
    // 일반 도메인에서 최상위 페이지로 열리면 이 제약이 없어서 삼성/아이폰 모두
    // 정상적으로 카메라 권한 요청 창이 뜨고 사용할 수 있습니다.
    //
    // 동작 방식: 여기서 QR을 스캔해 디코딩한 값이 우리 식대 체크인 시스템의
    // URL이면(반드시 script.google.com 도메인) 그 주소로 바로 이동시켜
    // 체크인 화면을 띄웁니다. 로그인 토큰은 그 도메인에 저장되어 있으므로
    // 이동 후 바로 원탭 체크인 화면이 보입니다.
    // ------------------------------------------------------------------

    // 스캔된 URL이 우리 시스템(Apps Script) 것인지 확인하기 위한 허용 호스트.
    // 필요 시 여기에 추가로 허용할 도메인을 넣을 수 있습니다.
    var ALLOWED_HOSTS = ['script.google.com', 'script.googleusercontent.com'];

    var hintEl = document.getElementById('hint');
    var backLink = document.getElementById('backLink');
    var video = document.getElementById('video');
    var canvas = document.getElementById('canvas');
    var stream = null;
    var rafId = null;
    var active = false;
    var decoded = false;

    function setHint(text, cls) {
      hintEl.textContent = text;
      hintEl.className = 'hint' + (cls ? ' ' + cls : '');
    }

    function setupBackLink() {
      var params = new URLSearchParams(location.search);
      var back = params.get('back');
      if (back) {
        try {
          var backUrl = new URL(back);
          backLink.href = backUrl.href;
          backLink.style.display = 'block';
        } catch (e) { /* 잘못된 back 파라미터는 무시 */ }
      }
    }

    function isAllowedUrl(text) {
      try {
        var u = new URL(text);
        if (u.protocol !== 'https:' && u.protocol !== 'http:') return false;
        return ALLOWED_HOSTS.indexOf(u.hostname) !== -1;
      } catch (e) {
        return false;
      }
    }

    function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setHint('이 브라우저는 카메라 기능을 지원하지 않습니다.\nSafari(아이폰) 또는 Chrome(삼성/안드로이드)으로 열어주세요.', 'err');
        return;
      }
      navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } })
        .catch(function() { return navigator.mediaDevices.getUserMedia({ video: true }); })
        .then(function(s) {
          stream = s;
          video.srcObject = s;
          video.play();
          active = true;
          setHint('식당에 부착된 QR코드를 화면 중앙에 맞춰주세요');
          rafId = requestAnimationFrame(scanLoop);
        })
        .catch(function(err) {
          var msg = '카메라를 사용할 수 없습니다.\n브라우저 설정에서 카메라 권한을 허용한 뒤 새로고침해주세요.';
          if (err && err.name === 'NotAllowedError') {
            msg = '카메라 권한이 거부되었습니다.\n브라우저 주소창 옆 설정(자물쇠 아이콘)에서 카메라를 허용한 뒤 새로고침해주세요.';
          } else if (err && err.name === 'NotFoundError') {
            msg = '사용 가능한 카메라를 찾지 못했습니다.';
          }
          setHint(msg, 'err');
        });
    }

    function stopCamera() {
      active = false;
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
      if (stream) { stream.getTracks().forEach(function(t) { t.stop(); }); stream = null; }
    }

    function scanLoop() {
      if (!active) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var code = null;
        try { code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' }); } catch (e) {}
        if (code && code.data) {
          onDecoded(code.data);
          return;
        }
      }
      rafId = requestAnimationFrame(scanLoop);
    }

    function onDecoded(text) {
      if (decoded) return;
      if (!isAllowedUrl(text)) {
        setHint('알 수 없는 QR입니다. 식대 체크인용 QR을 스캔해주세요.', 'err');
        rafId = requestAnimationFrame(scanLoop);
        return;
      }
      decoded = true;
      stopCamera();
      setHint('인식 완료! 체크인 화면으로 이동합니다...', 'ok');
      setTimeout(function() { location.href = text; }, 400);
    }

    setupBackLink();
    startCamera();
  </script>
</body>
</html>
